name: CI

# Automatic runs are switched off (decision 2026-10-28); the workflow is also
# disabled on GitHub (`gh workflow disable CI`). Re-enable with
# `gh workflow enable CI` and restore the push/pull_request triggers.
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sqlc generated code is up to date
        run: docker compose --profile tools run --rm sqlc diff
      - name: go vet + go test (in the same container as locally)
        run: docker compose --profile test run --rm backend-test sh -c "go vet ./... && go test ./..."
      - name: build api image
        run: docker compose build api
      - name: tear down
        if: always()
        run: docker compose --profile test down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint + test + build (in the same container as locally)
        run: docker compose --profile test run --rm web-test
      - name: build web image
        run: docker compose build web
      - name: tear down
        if: always()
        run: docker compose --profile test down -v
