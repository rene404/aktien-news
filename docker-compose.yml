name: aktien-news

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aktien_news
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
      args:
        CMD: api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aktien_news?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "${API_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy

  # One-shot: migrate + load master data. `docker compose run --rm seed`
  seed:
    profiles: ["tools"]
    build:
      context: ./backend
      args:
        CMD: seed
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aktien_news?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Toolchain-Container: Go ist lokal nicht installiert.
  backend-test:
    profiles: ["test"]
    image: golang:1.26-alpine
    working_dir: /src
    environment:
      CGO_ENABLED: "0"
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "test", "./..."]

  # Regenerates internal/store/db from migrations + queries.
  sqlc:
    profiles: ["tools"]
    image: sqlc/sqlc:1.31.1
    working_dir: /src/internal/store
    volumes:
      - ./backend:/src
    command: ["generate"]

volumes:
  pgdata:
  gomod:
  gobuild:
