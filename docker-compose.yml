name: aktien-news

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aktien_news
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
      args:
        CMD: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aktien_news?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        CMD: worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aktien_news?sslmode=disable
      USER_AGENT: ${USER_AGENT:-aktien-news-bot/0.1 (+https://aktien-news.at)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3020}:3000"
    restart: unless-stopped
    depends_on:
      - api

  # One-shot: migrate + load master data. `docker compose run --rm seed`
  seed:
    profiles: ["tools"]
    build:
      context: ./backend
      args:
        CMD: seed
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/aktien_news?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # Toolchain-Container: Go ist lokal nicht installiert.
  backend-test:
    profiles: ["test"]
    image: golang:1.26-alpine
    working_dir: /src
    environment:
      CGO_ENABLED: "0"
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    command: ["go", "test", "./..."]

  # Frontend toolchain (Node is not installed on the host).
  web-test:
    profiles: ["test"]
    image: node:24-alpine
    working_dir: /app
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci && npm run lint && npm run test && npm run build"]

  # Regenerates internal/store/db from migrations + queries.
  sqlc:
    profiles: ["tools"]
    image: sqlc/sqlc:1.31.1
    working_dir: /src/internal/store
    volumes:
      - ./backend:/src
    command: ["generate"]

volumes:
  pgdata:
  web_node_modules:
  gomod:
  gobuild:
